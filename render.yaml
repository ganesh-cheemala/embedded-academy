services:
  - type: web
    name: embedded-academy
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ACADEMY_ENV
        value: production
      - key: ACADEMY_COOKIE_SECURE
        value: "1"
      - key: ACADEMY_TRUSTED_HOSTS
        value: "*"
      - key: ACADEMY_BASE_URL
        sync: false
      - key: ACADEMY_SECRET
        generateValue: true
      - key: ACADEMY_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: embedded-academy-db
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "1"

databases:
  - name: embedded-academy-db
    plan: free
    region: singapore
    databaseName: academy
    user: academy
    postgresMajorVersion: "18"
