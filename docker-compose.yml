services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ACADEMY_ENV: production
      ACADEMY_SECRET: ${ACADEMY_SECRET:?Set ACADEMY_SECRET}
      ACADEMY_ADMIN_PASSWORD: ${ACADEMY_ADMIN_PASSWORD:?Set ACADEMY_ADMIN_PASSWORD}
      ACADEMY_COOKIE_SECURE: ${ACADEMY_COOKIE_SECURE:-0}
      ACADEMY_BASE_URL: ${ACADEMY_BASE_URL:-http://localhost:8000}
      ACADEMY_TRUSTED_HOSTS: ${ACADEMY_TRUSTED_HOSTS:-localhost,127.0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-1}
      DATABASE_URL: postgresql://academy:${POSTGRES_PASSWORD:-change-this-password}@db:5432/academy
    volumes:
      - academy_uploads:/app/uploads
  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:${HTTP_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  postgres_data:
  academy_uploads:
